services:
  staticman:
    image: ghcr.io/romaingiraud/staticman-reborn:latest
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    volumes:
      -
        type: bind
        source: ./config.production.json
        target: /app/config.production.json
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: wget -q --spider http://127.0.0.1:3000/health || exit 1
      interval: 2s
      timeout: 10s
      retries: 15
